# ---------------------------------------------------------------------------------------------
# Physics Factory - runtime configuration
#
# Every path lives here; nothing is hardcoded in Java. Values can be overridden without editing
# this file, in the usual Spring Boot order of precedence:
#   * command line          --physics-factory.blender.executable-path=/opt/blender/blender
#   * environment variables BLENDER_EXECUTABLE, PHYSICS_FACTORY_HOME
#   * an external file      --spring.config.additional-location=file:./configs/
# ---------------------------------------------------------------------------------------------
spring:
  application:
    name: physics-factory
  main:
    banner-mode: "off"          # the application prints its own startup summary
    web-application-type: none  # desktop application: no embedded web server

physics-factory:
  workspace:
    # Root of every managed folder. Defaults to the process working directory.
    root: ${PHYSICS_FACTORY_HOME:${user.dir}}
    # One entry per WorkspaceDirectory constant. Paths are relative to the root above; startup fails
    # if an entry is missing, absolute, or escapes the root.
    directories:
      assets: assets
      configs: configs
      video-output: output/videos
      thumbnail-output: output/thumbnails
      image-output: output/renders
      batch-output: output/batches
      logs: logs
      # The render workspace. Everything below blender/ belongs to the render engine and can be
      # deleted without losing a deliverable; output/ holds what the user actually wants.
      blender-scripts: blender/scripts
      # The engine directory must keep the name 'engine': it is imported as a Python package by
      # render_scene.py and by every template module.
      blender-engine: blender/engine
      blender-assets: blender/assets
      blender-templates: blender/templates
      blender-renders: blender/renders
      blender-cache: blender/cache
  blender:
    # Absolute path, a path relative to the workspace root, or a bare program name resolved on PATH.
    # Examples:
    #   macOS   /Applications/Blender.app/Contents/MacOS/Blender
    #   Linux   /usr/bin/blender
    #   Windows C:/Program Files/Blender Foundation/Blender 4.2/blender.exe
    executable-path: ${BLENDER_EXECUTABLE:blender}
    # How long 'blender --version' may take. Blender loads its whole runtime even for this.
    version-timeout: 30s
    # The job run by '--healthcheck'. It proves the integration works; it renders nothing, so
    # output-file only documents where the template would write once rendering exists.
    healthcheck:
      template: healthcheck
      output-file: output/videos/healthcheck.mp4
      timeout: 2m
  # The scene rendered by '--render'. 'template' is resolved by the template registry inside Blender;
  # adding a template module under src/main/resources/blender/templates is all a new scene needs.
  # The output extension decides the artefact: .mp4 is a reel, .png is a still.
  render:
    template: BouncingSphere
    output-file: output/videos/bouncing_sphere.mp4
    # Hundreds of frames, so this is a render budget rather than a startup timeout.
    timeout: 45m
    # PRODUCTION renders what gets published. FAST renders the same scene, same physics and same
    # timing at half the resolution, a quarter of the samples and no raytracing - for iterating on a
    # template without waiting out a full render.
    quality: PRODUCTION
    # Passed to the template verbatim. 'seed' is added automatically when absent and recorded in the
    # manifest, so any render can be reproduced from what it wrote.
    #   BouncingSphere: durationSeconds, dropHeight, physicsPreset, cameraPreset,
    #                   material, groundMaterial
    #   DefaultSphere:  material, background
    parameters:
      durationSeconds: 10
      dropHeight: 5
      physicsPreset: Bouncy
      material: DefaultGlass

  # One command, many videos: '--batch'. Every video gets its own seed derived from the batch seed,
  # so the same batch seed always produces the same set of scenes. Leave 'seed' out and one is
  # generated and recorded in the batch manifest.
  batch:
    template: MarbleArena
    count: 3
    dry-run: false
    timeout: 45m
    # Independent of render.quality: a batch is usually previewed at FAST, then the same seeds are
    # re-rendered at PRODUCTION once the reels look right.
    quality: PRODUCTION
    parameters:
      durationSeconds: 20

logging:
  level:
    root: INFO
    com.physicsfactory: INFO
